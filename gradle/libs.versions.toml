[versions]
kotlin = "2.4.21"
ktlint-gradle = "14.2.0"
lavalink-gradle = "1.1.2"
plugin-api = "4.2.1"
lavaplayer = "2.2.7"
slf4j = "2.0.19"
junit-jupiter = "6.1.3"
mockwebserver3 = "5.5.1"

[libraries]
plugin-api = { module = "dev.arbjerg.lavalink:plugin-api", version.ref = "plugin-api" }
lavaplayer = { module = "dev.arbjerg:lavaplayer", version.ref = "lavaplayer" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-jupiter" }
mockwebserver3 = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "mockwebserver3" }
mockwebserver3-junit5 = { module = "com.squareup.okhttp3:mockwebserver3-junit5", version.ref = "mockwebserver3" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
lavalink = { id = "dev.arbjerg.lavalink.gradle-plugin", version.ref = "lavalink-gradle" }
