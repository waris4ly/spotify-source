name: Publish

on:
  push:
  pull_request:
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      MAVEN_USERNAME: ${{ vars.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project version
        id: version
        run: echo "version=$(./gradlew properties -q | grep '^version:' | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Check Kotlin style (ktlint)
        run: ./gradlew ktlintCheck --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Build project
        run: ./gradlew build --no-daemon

      - name: Publish Maven artifacts
        if: github.event_name != 'pull_request'
        run: ./gradlew publish --no-daemon -PMAVEN_USERNAME=$MAVEN_USERNAME -PMAVEN_PASSWORD=$MAVEN_PASSWORD

      - name: Upload common Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spotify-common-${{ steps.version.outputs.version }}.jar
          path: common/build/libs/spotify-common-*.jar

      - name: Upload plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spotify-plugin-${{ steps.version.outputs.version }}.jar
          path: plugin/build/libs/spotify-plugin-*.jar

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download spotify-common Artifact
        uses: actions/download-artifact@v4
        with:
          name: spotify-common-${{ needs.build.outputs.version }}.jar
          path: .

      - name: Download spotify-plugin Artifact
        uses: actions/download-artifact@v4
        with:
          name: spotify-plugin-${{ needs.build.outputs.version }}.jar
          path: .

      - name: Upload Artifacts to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: '*.jar'
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitDraftDuringUpdate: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true
